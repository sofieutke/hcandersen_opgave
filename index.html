<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="robots" content="noindex, nofollow">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H.C. Andersen</title>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="billeder/H C Andersen silhuet.jpg" type="image/favicon">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Corben&family=Great+Vibes&family=Lato:wght@700&family=Lexend+Exa:wght@100..900&family=Lora:ital,wght@0,400..700;1,400..700&family=Patrick+Hand&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <img src="billeder/Skærmbillede 2025-09-12 kl. 18.05.11.png" alt="logo">
        <div class="header-text">
            <p>Magiske oplevelser på Assistens Kirkegård</p>
        </div>

    </header>

    <main>
        <section class="video-section">
            <div class="video-wrapper">
                <iframe width="560" height="315" src="https://www.youtube.com/embed/gCuAq7xgRFY?si=ZVlBeWFORIjj7LMv"
                    title="YouTube video player" frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            </div>
        </section>

        <section class="map-container">
            <div class="map-wrapper">
                <img src="billeder/assistensKirkegaardMap.svg" alt="kort over kirkegården" class="svg-map">

                <div class="map-point point-1">
                    <button class="tooltip-btn" aria-label="Vis tooltip"></button>
                    <div class="tooltip">
                        <img src="billeder/SoldatMap.png" alt="Eventyr 1">
                        <p>Lyt til Fyrtøjet</p>
                    </div>
                </div>

                <div class="map-point point-2">
                    <button class="tooltip-btn" aria-label="Vis tooltip"></button>
                    <div class="tooltip">
                        <img src="billeder/GravMap.png" alt="Gravsted">
                        <p>H.C. Andersens gravsted</p>
                    </div>
                </div>

                <div class="map-point point-3">
                    <button class="tooltip-btn" aria-label="Vis tooltip"></button>
                    <div class="tooltip">
                        <img src="billeder/hansMap.png" alt="Eventyr 3">
                        <p>Lyt til Klods Hans</p>
                    </div>
                </div>

                <div class="map-point point-4">
                    <button class="tooltip-btn" aria-label="Vis tooltip"></button>
                    <div class="tooltip">
                        <img src="billeder/AndMap.png" alt="Eventyr 4">
                        <p>Den Grimme Ælling</p>
                    </div>
                </div>
            </div>
        </section>

        <script src="script.js"></script>

        <div class="meta-container">
            <img src="billeder/metaad.png" alt="meta ad">
            <img src="billeder/metaad2.png" alt="meta ad2">
        </div>
    </main>

    <footer></footer>
</body>

</html>
